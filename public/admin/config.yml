backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: "https://muncangkopong.desa.id"
display_url: "https://muncangkopong.desa.id"
logo_url: "/logo-kkm.png"

locale: "id"

collections:
  - name: "berita"
    label: "Berita Desa"
    folder: "src/content/berita"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul Berita", name: "title", widget: "string" }
      - {
          label: "Tanggal Publish",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "DD/MM/YYYY",
          time_format: false,
        }
      - {
          label: "Penulis",
          name: "author",
          widget: "string",
          default: "Admin Desa",
        }
      - {
          label: "Deskripsi Singkat (Untuk Pratinjau/WhatsApp)",
          name: "description",
          widget: "text",
        }
      - {
          label: "Foto Utama Berita",
          name: "image",
          widget: "image",
          required: false,
        }
      - { label: "Isi Berita Lengkap", name: "body", widget: "markdown" }

  - name: "pengaturan"
    label: "Pengaturan Website"
    files:
      - label: "Statistik & Data Desa"
        name: "statistik"
        file: "src/data/statistik.json"
        description: "Atur angka dan jumlah statistik desa yang tampil di Beranda"
        fields:
          - label: "Daftar Statistik"
            name: "daftar_statistik"
            widget: "list"
            summary: "{{fields.label}} - {{fields.angka}}"
            fields:
              - {
                  label: "Ikon (Emoji/Teks)",
                  name: "ikon",
                  widget: "string",
                  default: "👥",
                }
              - {
                  label: "Angka / Jumlah",
                  name: "angka",
                  widget: "string",
                  default: "0",
                }
              - {
                  label: "Nama / Keterangan",
                  name: "label",
                  widget: "string",
                  default: "Keterangan Baru",
                }
