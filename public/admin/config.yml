backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "berita"
    label: "Berita Desa"
    folder: "src/content/berita"
    create: true
    slug: "{{ year }}-{{ month }}-{{ day }}-{{ slug }}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - {
          label: "Penulis",
          name: "author",
          widget: "string",
          default: "Admin Desa",
        }
      - {
          label: "Foto Gambar",
          name: "image",
          widget: "image",
          required: false,
        }
      - { label: "Ringkasan", name: "description", widget: "text" }
      - { label: "Isi Konten", name: "body", widget: "markdown" }
