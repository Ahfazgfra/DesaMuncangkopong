backend:
  name: github
  repo: Ahfazgfra/DesaMuncangkopong
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: "https://muncangkopong.desa.id"
display_url: "https://muncangkopong.desa.id"
logo_url: "/logo-kkm.png"

locale: "id"

collections:
  - name: "berita"
    label: "Berita Desa"
    folder: "src/content/berita"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul Berita", name: "title", widget: "string" }
      - {
          label: "Tanggal Publish",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          date_format: "DD/MM/YYYY",
          time_format: false,
        }
      - {
          label: "Penulis",
          name: "author",
          widget: "string",
          default: "Admin Desa",
        }
      - {
          label: "Deskripsi Singkat (Untuk Pratinjau/WhatsApp)",
          name: "description",
          widget: "text",
        }
      - {
          label: "Foto Utama Berita",
          name: "image",
          widget: "image",
          required: false,
        }
      - { label: "Isi Berita Lengkap", name: "body", widget: "markdown" }

  - name: "pengaturan"
    label: "Pengaturan Website"
    files:
      - label: "Statistik & Data Desa"
        name: "statistik"
        file: "src/data/statistik.json"
        description: "Atur angka dan jumlah statistik desa yang tampil di Beranda"
        fields:
          - label: "Daftar Statistik"
            name: "daftar_statistik"
            widget: "list"
            summary: "{{fields.label}} - {{fields.angka}}"
            fields:
              - {
                  label: "Ikon (Emoji/Teks)",
                  name: "ikon",
                  widget: "string",
                  default: "👥",
                }
              - {
                  label: "Angka / Jumlah",
                  name: "angka",
                  widget: "string",
                  default: "0",
                }
              - {
                  label: "Nama / Keterangan",
                  name: "label",
                  widget: "string",
                  default: "Keterangan Baru",
                }

      - label: "Beranda (Sambutan Kades)"
        name: "beranda"
        file: "src/data/beranda.json"
        description: "Atur foto dan teks sambutan Kepala Desa di Halaman Utama"
        fields:
          - { label: "Nama Kepala Desa", name: "nama_kades", widget: "string" }
          - {
              label: "Jabatan",
              name: "jabatan",
              widget: "string",
              default: "Kepala Desa Muncangkopong",
            }
          - {
              label: "Foto Kepala Desa",
              name: "foto_kades",
              widget: "image",
              required: false,
            }
          - { label: "Teks Sambutan", name: "sambutan", widget: "text" }

      - label: "Profil & Sejarah Desa"
        name: "profil"
        file: "src/data/profil.json"
        description: "Atur Sejarah, Visi, Misi, dan Daftar Aparatur Desa"
        fields:
          - {
              label: "Sejarah Desa",
              name: "sejarah",
              widget: "text",
              hint: "Tekan Enter untuk membuat paragraf baru.",
            }
          - { label: "Teks Visi", name: "visi", widget: "text" }
          - label: "Daftar Misi"
            name: "misi"
            widget: "list"
            fields:
              - { label: "Teks Misi", name: "teks", widget: "string" }
          - label: "Daftar Aparatur Desa"
            name: "aparatur"
            widget: "list"
            summary: "{{fields.nama}} - {{fields.jabatan}}"
            fields:
              - { label: "Nama Aparatur", name: "nama", widget: "string" }
              - { label: "Jabatan", name: "jabatan", widget: "string" }
          - { label: "Alamat Kantor Desa", name: "alamat", widget: "text" }
          - {
              label: "Kode Embed Google Maps (iframe)",
              name: "peta_embed",
              widget: "string",
              hint: "Salin kode HTML iframe dari Google Maps di sini",
            }

  - name: "umkm"
    label: "Produk UMKM"
    folder: "src/content/umkm"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: "Nama Produk", name: "title", widget: "string" }
      - { label: "Nama Penjual", name: "penjual", widget: "string" }
      - { label: "Foto Produk", name: "image", widget: "image" }
      - {
          label: "Harga (Contoh: Mulai Rp 25.000)",
          name: "harga",
          widget: "string",
        }
      - { label: "Deskripsi Singkat", name: "description", widget: "text" }
      - {
          label: "Nomor WhatsApp (Gunakan awalan 62, misal: 62812xxx)",
          name: "whatsapp",
          widget: "string",
          required: false,
        }

  - name: "galeri"
    label: "Galeri Kegiatan"
    folder: "src/content/galeri"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: "Judul/Deskripsi Foto", name: "title", widget: "string" }
      - { label: "Foto Kegiatan", name: "image", widget: "image" }
